<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in and Sign up | Pinterest</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background-image:url(My\ images/bg-img1.jpg);background-size: cover;">
<div class="header">
  <a class="logo" href="index.html">Pinterest</a>
  <input type="search" id="mysearch" class="mysearch" placeholder="Search for easy dinner, fashion, etc.">
  <div class="menu">
    <a href="index.html" class="active">Home</a>
    <a href="businesses.html" >Businesses</a>
    <a href="create.html" >Create</a>
    <a href="news.html" >News</a>
    <a href="login.html" class="red">Log in</a>
    <a href="sign-up.html" class="grey">Sign up</a>
  </div>
</div>
<div class="two">
    <div class="form-text"><h1>sign up to get<br>your ideas</h1></div>
  <div class="form-box" id="signup">
    <h2>Sign up</h2>
    <p>Find new ideas to try</p>
    <form action="login.html+" method="get">
      <input type="text" required placeholder="Full name"pattern="^[A-Z a-z]{3-15}">
      <input type="email" required placeholder="Email">
      <input type="password" required placeholder="Create a password" pattern="[A-Z a-z 0-9] {3-15}">
      <input type="date">
      <button class="btn">Continue</button>
    </form>
  </div>
</div>
<div class="footer">&copy; 2026 Pinterest clone-Built with HTML,CSS</div>
</body>
</html>
