<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in and Sign up | Pinterest</title>
<link rel="stylesheet" href="style.css">
</head>
<body style="background-image:url(My\ images/bg-img1.jpg);background-size: cover;">
<div class="header">
  <a class="logo" href="index.html">Pinterest</a>
  <input type="search" id="mysearch" class="mysearch" placeholder="Search for easy dinner, fashion, etc.">
  <div class="menu">
    <a href="index.html" class="active">Home</a>
    <a href="businesses.html" >Businesses</a>
    <a href="create.html" >Create</a>
    <a href="news.html" >News</a>
    <a href="login.html" class="red">Log in</a>
    <a href="sign-up.html" class="grey">Sign up</a>
  </div>
</div>
<div class="two">
  <div class="form-box">
    <h2>Welcome to Pinterest</h2>
    <p>Log in to see your ideas</p>
    <form action="index.html">
      <input type="email" required placeholder="Email" pattern="^[A-Z a-z]{3-15}">
      <input type="password" required placeholder="Password" pattern="[A-Z a-z 0-9] {3-15}">
      <button class="btn">Log in</button>
      </form>
  </div>
  <div class="form-text"><h1>log-in to get<br>your ideas</h1></div>
</div>
<div class="footer">&copy; 2026 Pinterest clone-Built with HTML,CSS</div>
</body>
</html>
